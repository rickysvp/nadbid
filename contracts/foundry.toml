[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "paris"
via_ir = true
optimizer = true
optimizer_runs = 200
# Monad 测试网合约上限 128KB（非以太坊 24KB）；部署时需加 --disable-code-size-limit
# （Factory 内嵌 KolPass/KolAuction 字节码，超 24KB 本地检查）

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"

[etherscan]
monad_testnet = { key = "${ETHERSCAN_KEY}", url = "https://testnet.monadexplorer.com/api" }
